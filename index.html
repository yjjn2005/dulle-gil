<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울둘레길 · 수서역 기준</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">전국 둘레길 <small>수서역 출발·귀환 기준</small></div>
  <div class="regions" id="regions"></div>
  <div class="progress" id="progress"></div>
  <div class="legend" id="legend"></div>
  <div class="chips" id="chips"></div>
  <button class="chip" id="cmpbtn" style="margin-top:4px">거리 대조표 (공식 vs 지도)</button>
  <button class="chip" id="accbtn" style="margin-top:4px">대중교통 이동시간 확인(ODsay)</button>
  <div class="progress" id="accmsg"></div>
</header>
<div id="map"><div class="maperr" id="maperr">지도를 불러오는 중…</div></div>
<section id="sheet">
  <div class="handle" id="handle">코스 목록 <span id="count"></span></div>
  <div id="compare" style="display:none"></div>
  <div id="detail" style="display:none"></div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</section>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="gg-data.js"></script>
<script src="access-data.js"></script>
<script src="app.js"></script>
</body>
</html>
